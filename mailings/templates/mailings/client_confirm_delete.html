{% extends 'mailings/base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm border-0 p-4">
            <h3 class="fw-bold text-danger mb-3">Подтверждение удаления</h3>
            <p class="text-muted">Вы уверены, что хотите навсегда удалить получателя <strong>"{{ object.full_name }}"</strong>? Это действие нельзя будет отменить.</p>
            <hr>
            <form method="post">
                {% csrf_token %}
                <div class="d-flex justify-content-between">
                    <button type="submit" class="btn btn-danger px-4 fw-bold">Да, удалить</button>
                    <a href="{% url 'mailings:client_list' %}" class="btn btn-light border">Отмена</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
