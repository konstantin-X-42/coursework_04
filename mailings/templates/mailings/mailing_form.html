<!-- Универсальный шаблон форм для рассылок, клиентов и сообщений -->
{% extends 'mailings/base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm border-0 p-4">
            <h3 class="fw-bold mb-4">
                {% if object %} Редактирование записи {% else %} Создание новой записи {% endif %}
            </h3>
            <form method="post" novalidate>
                {% csrf_token %}
                
                <!-- Вывод полей в стиле Bootstrap -->
                {% for field in form %}
                    <div class="mb-3">
                        <label class="form-label fw-semibold text-secondary">{{ field.label }}</label>
                        {{ field }}
                        {% if field.errors %}
                            <div class="text-danger small mt-1">{{ field.errors|striptags }}</div>
                        {% endif %}
                    </div>
                {% endfor %}

                <div class="d-flex justify-content-between mt-4">
                    <button type="submit" class="btn btn-primary px-4">Сохранить</button>
                    <a href="javascript:history.back()" class="btn btn-light border">Отмена</a>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- Скрипт, автоматически добавляющий класс Bootstrap к инпутам Django-формы -->
<script>
    document.querySelectorAll('input, select, textarea').forEach(function(el) {
        if (el.type !== 'checkbox') {
            el.classList.add('form-control');
        } else {
            el.classList.add('form-check-input');
        }
    });
</script>
{% endblock %}
