{% extends 'mailings/base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow-sm border-0 p-4">
            <h3 class="fw-bold mb-4">
                {% if object %}Редактирование клиента{% else %}Добавление нового клиента{% endif %}
            </h3>
            <hr>
            <form method="post" novalidate>
                {% csrf_token %}
                
                {% for field in form %}
                    <div class="mb-3">
                        <label class="form-label fw-semibold text-secondary">{{ field.label }}</label>
                        {{ field }}
                        {% if field.errors %}
                            <div class="text-danger small mt-1">{{ field.errors|striptags }}</div>
                        {% endif %}
                    </div>
                {% endfor %}

                <div class="d-flex justify-content-between mt-4">
                    <button type="submit" class="btn btn-success px-4 fw-bold">Сохранить</button>
                    <a href="{% url 'mailings:client_list' %}" class="btn btn-light border">Отмена</a>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- Магия Bootstrap для полей формы -->
<script>
    document.querySelectorAll('input, textarea').forEach(el => el.classList.add('form-control'));
</script>
{% endblock %}
