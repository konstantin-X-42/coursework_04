<!-- Экран «Письмо отправлено» -->

{% extends 'mailings/base.html' %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6 text-center">
        <div class="card shadow-sm border-0 p-5">
            <h3 class="fw-bold mb-3">Письмо отправлено</h3>
            <p class="text-muted mb-4">Мы отправили инструкцию по восстановлению пароля на указанный Email (при локальной разработке ссылка выведена в консоль сервера).</p>
            <a href="{% url 'users:login' %}" class="btn btn-primary px-4">Вернуться ко входу</a>
        </div>
    </div>
</div>
{% endblock %}
