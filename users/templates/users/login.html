<!-- Страница авторизации -->
{% extends 'mailings/base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow-sm border-0 p-4">
            <h3 class="fw-bold text-center mb-4">Вход в систему</h3>
            <form method="post" novalidate>
                {% csrf_token %}

                <!-- Перебор полей формы входа (Email и Пароль) -->
                {% for field in form %}
                    <div class="mb-3">
                        <label class="form-label fw-semibold text-secondary">{{ field.label }}</label>
                        {{ field }}
                        {% if field.errors %}
                            <div class="text-danger small mt-1">{{ field.errors|striptags }}</div>
                        {% endif %}
                    </div>
                {% endfor %}

                <!-- Кнопка отправки формы -->
                <div class="d-grid gap-2 mt-4">
                    <button type="submit" class="btn btn-primary py-2 fw-bold">Войти</button>
                </div>
            </form>

            <!-- Ссылка на страницу восстановления пароля (требование наставника) -->
            <div class="text-center mt-3">
                <a href="{% url 'users:password_reset' %}" class="text-decoration-none small text-muted">Забыли пароль?</a>
            </div>

            <!-- Ссылка на регистрацию нового аккаунта -->
            <div class="text-center mt-2">
                <span class="text-muted">Ещё нет аккаунта?</span>
                <a href="{% url 'users:register' %}" class="text-decoration-none fw-bold">Зарегистрироваться</a>
            </div>
        </div>
    </div>
</div>

<!-- Автоматическое добавление класса Bootstrap к полям ввода -->
<script>
    document.querySelectorAll('input').forEach(el => el.classList.add('form-control'));
</script>
{% endblock %}
