<!-- Форма ввода Email для сброса пароля -->

{% extends 'mailings/base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow-sm border-0 p-4">
            <h3 class="fw-bold text-center mb-3">Восстановление пароля</h3>
            <p class="text-muted text-center small mb-4">Введите ваш Email, и мы отправим ссылку для создания нового пароля.</p>
            
            <form method="post" novalidate>
                {% csrf_token %}
                <!-- Выводим поле для ввода Email -->
                {% for field in form %}
                    <div class="mb-3">
                        <label class="form-label fw-semibold text-secondary">{{ field.label }}</label>
                        {{ field }}
                        {% if field.errors %}
                            <div class="text-danger small mt-1">{{ field.errors|striptags }}</div>
                        {% endif %}
                    </div>
                {% endfor %}
                <div class="d-grid gap-2 mt-4">
                    <button type="submit" class="btn btn-primary py-2 fw-bold">Отправить ссылку</button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- Скрипт оформления полей в стиле Bootstrap -->
<script>
    document.querySelectorAll('input').forEach(el => el.classList.add('form-control'));
</script>
{% endblock %}
