<!-- Финальный экран «Пароль изменен» -->

{% extends 'mailings/base.html' %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5 text-center">
        <div class="card shadow-sm border-0 p-5">
            <h3 class="fw-bold text-success mb-3">Пароль успешно изменен!</h3>
            <p class="text-muted mb-4">Теперь вы можете войти в систему с новым паролем.</p>
            <a href="{% url 'users:login' %}" class="btn btn-primary px-4 fw-bold">Войти</a>
        </div>
    </div>
</div>
{% endblock %}
