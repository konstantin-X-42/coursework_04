<!-- Личный кабинет пользователя -->
{% extends 'mailings/base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm border-0 p-4">
            <div class="d-flex align-items-center mb-4">
                {% if user.avatar %}
                    <img src="{{ user.avatar.url }}" class="rounded-circle me-3" width="64" height="64" alt="Аватар">
                {% endif %}
                <div>
                    <h3 class="fw-bold m-0">Личный кабинет</h3>
                    <span class="text-muted">{{ user.email }}</span>
                </div>
            </div>
            <hr>
            <form method="post" enctype="multipart/form-data" novalidate>
                {% csrf_token %}
                
                {% for field in form %}
                    <div class="mb-3">
                        <label class="form-label fw-semibold text-secondary">{{ field.label }}</label>
                        {{ field }}
                        {% if field.errors %}
                            <div class="text-danger small mt-1">{{ field.errors|striptags }}</div>
                        {% endif %}
                    </div>
                {% endfor %}

                <div class="d-flex justify-content-between mt-4">
                    <button type="submit" class="btn btn-primary px-4">Сохранить изменения</button>
                    <a href="{% url 'mailings:home' %}" class="btn btn-light border">На главную</a>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
    document.querySelectorAll('input').forEach(function(el) {
        if (el.type !== 'file') {
            el.classList.add('form-control');
        }
    });
</script>
{% endblock %}
